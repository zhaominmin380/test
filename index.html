<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d6f42" />
    <meta name="description" content="v20-12 組一活頁簿的唯讀視覺復刻。" />
    <title>v20-12 組一 — Excel 視覺復刻</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231d6f42'/%3E%3Cpath d='M9 8h14v16H9z' fill='white' opacity='.96'/%3E%3Cpath d='M12 12h8M12 16h8M12 20h8M16 10v12' stroke='%231d6f42' stroke-width='1.3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="workbook-data.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="title-bar">
        <div class="brand-lockup">
          <span class="excel-mark" aria-hidden="true">X</span>
          <span class="workbook-title">v20-12-組一(錢老金寶)</span>
        </div>
      </header>

      <nav class="ribbon" aria-label="活頁簿功能列">
        <span class="ribbon-tab ribbon-tab-active">主頁</span>
      </nav>

      <section class="formula-bar" aria-label="名稱方塊和資料編輯列">
        <span class="name-box" id="name-box">A1</span>
        <span class="formula-fx" aria-hidden="true">fx</span>
        <output class="formula-content" id="formula-content"></output>
      </section>

      <main class="sheet-viewport">
        <div class="sheet-scroll" id="sheet-scroll" tabindex="0" aria-label="Excel 工作表內容">
          <div class="sheet-grid" id="sheet-grid"></div>
        </div>
      </main>

      <footer class="sheet-footer">
        <div class="sheet-nav" aria-hidden="true"><span>‹</span><span>›</span></div>
        <div class="sheet-tabs" id="sheet-tabs" aria-label="工作表頁籤"></div>
        <div class="hidden-sheet-wrap">
          <button class="hidden-sheet-button" id="hidden-sheet-button" type="button" aria-expanded="false">隱藏的工作表</button>
          <div class="hidden-sheet-menu" id="hidden-sheet-menu" hidden></div>
        </div>
        <div class="status-bar" id="status-bar">就緒</div>
        <div class="horizontal-scroll-control" aria-label="表格橫向移動">
          <span class="scroll-grip" aria-hidden="true">⋮</span>
          <button class="horizontal-scroll-step" id="horizontal-scroll-left" type="button" aria-label="向左移動表格">◀</button>
          <div class="horizontal-scroll-track" id="horizontal-scroll-track" role="scrollbar" tabindex="0" aria-label="表格橫向移動" aria-controls="sheet-scroll" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div class="horizontal-scroll-thumb" id="horizontal-scroll-thumb"></div>
          </div>
          <button class="horizontal-scroll-step" id="horizontal-scroll-right" type="button" aria-label="向右移動表格">▶</button>
        </div>
      </footer>
    </div>
  </body>
</html>
